name: agent-workspace
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_workspace
      POSTGRES_USER: agent_workspace
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - aw_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_workspace -d agent_workspace"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [database]
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_PRICE_INPUT_USD_PER_MILLION: ${OPENAI_PRICE_INPUT_USD_PER_MILLION:-0}
      OPENAI_PRICE_OUTPUT_USD_PER_MILLION: ${OPENAI_PRICE_OUTPUT_USD_PER_MILLION:-0}
      DB_URL: jdbc:postgresql://postgres:5432/agent_workspace
      DB_USER: agent_workspace
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      APP_BOOTSTRAP_ADMIN_USERNAME: ${APP_BOOTSTRAP_ADMIN_USERNAME:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    depends_on:
      postgres: {condition: service_healthy}
    networks: [database, web]
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on: [backend]
    networks: [web]
  # Local-only reverse proxy. No public ports are opened by default.
  gateway:
    image: nginx:1.27-alpine
    profiles: [local]
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [frontend, backend]
    networks: [web]
volumes:
  aw_postgres:
networks:
  database: {internal: true}
  web: {}
