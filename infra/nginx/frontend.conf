server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    location = /agent-workspace { return 301 /agent-workspace/; }
    location /agent-workspace/ {
        try_files $uri $uri/ /agent-workspace/index.html;
    }
    location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
}
