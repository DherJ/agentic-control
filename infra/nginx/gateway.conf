server {
    listen 80;
    server_name _;
    location = /agent-workspace { return 301 /agent-workspace/; }
    location /agent-workspace/api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /agent-workspace;
    }
    location = /agent-workspace/login {
        proxy_pass http://backend:8080/login;
        proxy_set_header Host $host;
    }
    location = /agent-workspace/logout {
        proxy_pass http://backend:8080/logout;
        proxy_set_header Host $host;
    }
    location /agent-workspace/ {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
