# Review and adapt inside your EXISTING HTTPS server block. Do not replace the current Nginx config.
# Connect the existing proxy to the compose web network before enabling these routes.
location = /agent-workspace { return 301 /agent-workspace/; }
location /agent-workspace/api/ {
    proxy_pass http://agent-workspace-backend:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /agent-workspace;
}
location /agent-workspace/ {
    proxy_pass http://agent-workspace-frontend:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
